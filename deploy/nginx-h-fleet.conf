# H-Fleet nginx reverse proxy — install as /etc/nginx/conf.d/h-fleet.conf
# RHEL8 note: allow nginx to proxy to the app port under SELinux:
#   sudo setsebool -P httpd_can_network_connect 1
server {
    listen 80;
    server_name hfleet.example.internal;   # <- your hostname

    # Once TLS certs are in place, redirect to https and add a 443 block
    # (certbot --nginx will write it for you).

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js dev/HMR and any future websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Long cache for Next's hashed static assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
